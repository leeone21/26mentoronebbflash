<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6/13 기출 플래시카드 | 멘토원</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1B2A4A; --navy-light: #243660;
    --gold: #C5963A; --gold-light: #E8B84B;
    --white: #FFFFFF; --gray: #8A8F9E;
    --card-radius: 20px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Noto Sans KR',sans-serif; background:var(--navy); min-height:100vh; color:var(--white); overflow-x:hidden; }
  body::before { content:''; position:fixed; inset:0; background: radial-gradient(ellipse 60% 40% at 80% 20%,rgba(255,80,80,.06) 0%,transparent 60%), radial-gradient(ellipse 50% 60% at 10% 80%,rgba(36,54,96,.6) 0%,transparent 60%); pointer-events:none; z-index:0; }
  .app { position:relative; z-index:1; max-width:760px; margin:0 auto; padding:24px 20px 60px; }

  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  .logo { font-size:11px; font-weight:700; letter-spacing:3px; color:var(--gold); text-transform:uppercase; }
  .logo span { color:var(--gray); font-weight:300; }
  .header-title { font-size:13px; color:var(--gray); }

  .mode-toggle { display:flex; background:rgba(255,255,255,.06); border-radius:10px; padding:4px; margin-bottom:20px; }
  .mode-btn { flex:1; padding:8px 0; border:none; border-radius:7px; background:transparent; color:var(--gray); font-family:'Noto Sans KR',sans-serif; font-size:13px; font-weight:500; cursor:pointer; transition:all .2s; }
  .mode-btn.active { background:#C0392B; color:var(--white); font-weight:700; }

  .category-tabs { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
  .tab { padding:7px 14px; border-radius:100px; border:1px solid rgba(255,255,255,.12); background:transparent; color:var(--gray); font-size:12px; font-weight:500; font-family:'Noto Sans KR',sans-serif; cursor:pointer; transition:all .2s; }
  .tab:hover { border-color:#E07070; color:#E07070; }
  .tab.active { background:#C0392B; border-color:#C0392B; color:var(--white); font-weight:700; }

  .progress-bar-wrap { margin-bottom:16px; }
  .progress-info { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .progress-label { font-size:12px; color:var(--gray); }
  .progress-count { font-family:'DM Mono',monospace; font-size:13px; color:#E07070; }
  .progress-track { height:3px; background:rgba(255,255,255,.08); border-radius:99px; overflow:hidden; }
  .progress-fill { height:100%; background:linear-gradient(90deg,#C0392B,#E07070); border-radius:99px; transition:width .4s ease; }

  .score-badges { display:flex; gap:10px; margin-bottom:24px; }
  .badge { display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:8px; font-size:12px; font-weight:600; font-family:'DM Mono',monospace; }
  .badge-correct { background:rgba(45,122,95,.15); border:1px solid rgba(45,122,95,.3); color:#5EC49A; }
  .badge-wrong { background:rgba(184,50,50,.12); border:1px solid rgba(184,50,50,.25); color:#E07070; }
  .badge-dot { width:6px; height:6px; border-radius:50%; }
  .badge-correct .badge-dot { background:#5EC49A; }
  .badge-wrong .badge-dot { background:#E07070; }

  .card-container { perspective:1200px; margin-bottom:20px; }
  .card-inner { position:relative; width:100%; min-height:260px; transform-style:preserve-3d; transition:transform .55s cubic-bezier(.4,0,.2,1); }
  .card-inner.flipped { transform:rotateY(180deg); }
  .card-face { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:var(--card-radius); padding:32px 36px; display:flex; flex-direction:column; min-height:260px; }
  .card-front { background:var(--white); color:var(--navy); }
  .card-front .card-part { font-size:10px; font-weight:700; letter-spacing:2.5px; color:#C0392B; text-transform:uppercase; margin-bottom:16px; }
  .card-front .card-question { font-size:19px; font-weight:700; color:var(--navy); line-height:1.5; flex:1; display:flex; align-items:center; }
  .card-back { background:var(--navy-light); border:1px solid rgba(192,57,43,.25); transform:rotateY(180deg); overflow-y:auto; }
  .card-back .card-part { font-size:10px; font-weight:700; letter-spacing:2.5px; color:#E07070; text-transform:uppercase; margin-bottom:12px; }
  .card-back .answer-label { font-size:11px; color:var(--gray); margin-bottom:10px; letter-spacing:1px; }
  .card-back .card-answer { font-size:15px; font-weight:500; line-height:1.8; color:var(--white); flex:1; }

  .blank-card { background:var(--white); border-radius:var(--card-radius); padding:32px 36px; margin-bottom:20px; min-height:220px; display:flex; flex-direction:column; }
  .blank-card .card-part { font-size:10px; font-weight:700; letter-spacing:2.5px; color:#C0392B; text-transform:uppercase; margin-bottom:16px; }
  .blank-card .card-question { font-size:17px; font-weight:700; color:var(--navy); margin-bottom:24px; line-height:1.5; }
  .answer-tokens { display:flex; flex-wrap:wrap; gap:8px; align-items:center; flex:1; }
  .token { display:inline-flex; align-items:center; justify-content:center; padding:8px 14px; border-radius:8px; font-size:14px; font-weight:600; min-width:70px; text-align:center; line-height:1.4; }
  .token-blank { background:#F0F2F8; color:transparent; border:2px dashed #C8CCE0; min-width:90px; }
  .token-blank.active { background:#FFF0F0; border:2px dashed #E07070; animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{border-color:#E07070} 50%{border-color:#C0392B} }
  .token-correct { background:rgba(45,122,95,.12); color:#1A6647; border:2px solid rgba(45,122,95,.35); }
  .token-wrong { background:rgba(184,50,50,.1); color:#8B1A1A; border:2px solid rgba(184,50,50,.3); }
  .token-sep { background:transparent; color:var(--navy); font-size:15px; font-weight:400; padding:4px; min-width:auto; }

  .choices-area { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:20px; }
  .choice-btn { padding:10px 18px; border-radius:10px; border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.06); color:var(--white); font-family:'Noto Sans KR',sans-serif; font-size:14px; font-weight:500; cursor:pointer; transition:all .18s; }
  .choice-btn:hover { background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.3); transform:translateY(-1px); }
  .choice-btn:disabled { opacity:.4; cursor:default; transform:none; }
  .choice-btn.flash-wrong { background:rgba(184,50,50,.25); border-color:rgba(184,50,50,.5); color:#E07070; }
  .choice-btn.flash-correct { background:rgba(45,122,95,.2); border-color:rgba(45,122,95,.5); color:#5EC49A; }

  .action-area { display:flex; gap:12px; margin-bottom:16px; }
  .btn { flex:1; padding:13px; border-radius:12px; border:none; font-family:'Noto Sans KR',sans-serif; font-size:14px; font-weight:700; cursor:pointer; transition:all .2s; display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn:active { transform:scale(.97); }
  .btn-wrong { background:rgba(184,50,50,.12); border:1px solid rgba(184,50,50,.3); color:#E07070; }
  .btn-wrong:hover { background:rgba(184,50,50,.2); }
  .btn-correct { background:rgba(45,122,95,.15); border:1px solid rgba(45,122,95,.35); color:#5EC49A; }
  .btn-correct:hover { background:rgba(45,122,95,.25); }
  .btn-next { background:#C0392B; color:var(--white); font-weight:700; }
  .btn-next:hover { background:#E04030; }

  .nav-area { display:flex; gap:10px; justify-content:center; }
  .btn-nav { padding:10px 20px; border-radius:10px; border:1px solid rgba(255,255,255,.12); background:transparent; color:var(--gray); font-family:'Noto Sans KR',sans-serif; font-size:13px; cursor:pointer; transition:all .2s; }
  .btn-nav:hover { border-color:rgba(255,255,255,.3); color:var(--white); }
  .btn-shuffle { padding:10px 16px; border-radius:10px; border:1px solid rgba(192,57,43,.2); background:transparent; color:#E07070; font-family:'Noto Sans KR',sans-serif; font-size:12px; cursor:pointer; transition:all .2s; }
  .btn-shuffle:hover { background:rgba(192,57,43,.1); }

  .complete-screen { display:none; text-align:center; padding:48px 20px; }
  .complete-screen.show { display:block; }
  .complete-icon { font-size:48px; margin-bottom:16px; }
  .complete-title { font-size:24px; font-weight:700; margin-bottom:8px; }
  .complete-sub { color:var(--gray); font-size:14px; margin-bottom:32px; }
  .result-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:32px; }
  .result-box { padding:20px; border-radius:14px; text-align:center; }
  .result-box-correct { background:rgba(45,122,95,.12); border:1px solid rgba(45,122,95,.25); }
  .result-box-wrong { background:rgba(184,50,50,.1); border:1px solid rgba(184,50,50,.2); }
  .result-num { font-family:'DM Mono',monospace; font-size:36px; font-weight:500; margin-bottom:4px; }
  .result-box-correct .result-num { color:#5EC49A; }
  .result-box-wrong .result-num { color:#E07070; }
  .result-label { font-size:12px; color:var(--gray); }
  .btn-restart { padding:14px 32px; border-radius:12px; border:none; background:#C0392B; color:var(--white); font-family:'Noto Sans KR',sans-serif; font-size:15px; font-weight:700; cursor:pointer; margin-right:10px; }
  .btn-restart:hover { background:#E04030; }
  .btn-wrong-only { padding:14px 24px; border-radius:12px; border:1px solid rgba(184,50,50,.3); background:transparent; color:#E07070; font-family:'Noto Sans KR',sans-serif; font-size:15px; font-weight:700; cursor:pointer; }
  .btn-wrong-only:hover { background:rgba(184,50,50,.1); }

  .tab.tab-wrong { border-color: rgba(184,50,50,.3); color: #E07070; }
  .tab.tab-wrong:hover { border-color: rgba(184,50,50,.6); }
  .tab.tab-wrong.active { background: #B83232; border-color: #B83232; color: var(--white); }
  .wrong-badge { display:inline-flex; align-items:center; justify-content:center; background:#B83232; color:var(--white); font-size:10px; font-weight:700; width:18px; height:18px; border-radius:50%; margin-left:4px; vertical-align:middle; }
  .tab.tab-wrong.active .wrong-badge { background:rgba(255,255,255,.3); }

  .wrong-note-card { background:var(--white); border-radius:var(--card-radius); padding:40px 36px; text-align:center; margin-bottom:20px; }
  .wrong-note-title { font-size:20px; font-weight:700; color:var(--navy); margin-bottom:16px; }
  .wrong-note-count { font-size:28px; font-weight:900; color:#B83232; margin-bottom:12px; }
  .wrong-note-desc { font-size:13px; color:var(--gray); line-height:1.7; margin-bottom:28px; }
  .wrong-note-btns { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .btn-clear-wrong { padding:13px 20px; border-radius:12px; border:1px solid rgba(184,50,50,.3); background:transparent; color:#E07070; font-family:'Noto Sans KR',sans-serif; font-size:14px; font-weight:600; cursor:pointer; transition:all .2s; }
  .btn-clear-wrong:hover { background:rgba(184,50,50,.1); }

  @media(max-width:480px){
    .card-face,.blank-card{padding:24px 20px;}
    .card-front .card-question,.blank-card .card-question{font-size:16px;}
    .token{font-size:13px;padding:7px 10px;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <a href="kichul_2026.html" style="font-size:12px;color:var(--gray);text-decoration:none;display:flex;align-items:center;gap:4px;transition:color .2s;" onmouseover="this.style.color='#E07070'" onmouseout="this.style.color='var(--gray)'">← 기출목록</a>
    <div class="header-title">📝 26년 6/13 기출</div>
  </div>

  <div class="mode-toggle">
    <button class="mode-btn active" id="modeFlash" onclick="setMode('flash')">📋 플래시카드</button>
    <button class="mode-btn" id="modeBlank" onclick="setMode('blank')">✏️ 빈칸 채우기</button>
  </div>

  <div class="category-tabs" id="categoryTabs"></div>

  <div class="progress-bar-wrap">
    <div class="progress-info">
      <span class="progress-label" id="progressLabel"></span>
      <span class="progress-count" id="progressCount">0 / 0</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>

  <div class="score-badges">
    <div class="badge badge-correct"><div class="badge-dot"></div><span id="correctCount">0</span> 정답</div>
    <div class="badge badge-wrong"><div class="badge-dot"></div><span id="wrongCount">0</span> 오답</div>
  </div>

  <div id="mainCardArea">
    <div id="flashMode">
      <div class="card-container">
        <div class="card-inner" id="cardInner">
          <div class="card-face card-front">
            <div class="card-part" id="cardPart"></div>
            <div class="card-question" id="cardQuestion"></div>
          </div>
          <div class="card-face card-back">
            <div class="card-part" id="cardPartBack"></div>
            <div class="answer-label">ANSWER</div>
            <div class="card-answer" id="cardAnswer"></div>
          </div>
        </div>
      </div>
      <div class="action-area" id="flashActionArea">
        <button class="btn btn-wrong" onclick="markCard(false)">✗ 모르겠어요</button>
        <button class="btn btn-correct" onclick="markCard(true)">✓ 알겠어요</button>
      </div>
      <div class="action-area" id="flashNextArea" style="display:none;">
        <button class="btn btn-next" onclick="nextCard()">다음으로 →</button>
      </div>
    </div>

    <div id="blankMode" style="display:none;">
      <div class="blank-card">
        <div class="card-part" id="blankPart"></div>
        <div class="card-question" id="blankQuestion"></div>
        <div class="answer-tokens" id="answerTokens"></div>
      </div>
      <div class="choices-area" id="choicesArea"></div>
      <div class="action-area" id="blankNextArea" style="display:none;">
        <button class="btn btn-next" onclick="nextCard()">다음으로 →</button>
      </div>
    </div>

    <div class="nav-area">
      <button class="btn-nav" onclick="prevCard()">← 이전</button>
      <button class="btn-shuffle" onclick="shuffleCards()">🔀 섞기</button>
      <button class="btn-nav" onclick="nextCard()">다음 →</button>
    </div>
  </div>

  <div id="wrongNotePanel" style="display:none;">
    <div class="wrong-note-card">
      <div class="wrong-note-title">📕 오답노트</div>
      <div class="wrong-note-count" id="wrongNoteCount">불러오는 중...</div>
      <div class="wrong-note-desc">틀린 문제들이 자동으로 저장됩니다.<br>맞힌 문제는 자동으로 제거돼요.</div>
      <div class="wrong-note-btns">
        <button class="btn btn-next" id="btnStartWrongReview" onclick="startWrongReview()">복습 시작 →</button>
        <button class="btn-clear-wrong" id="btnClearWrong" onclick="lsClear()">🗑 초기화</button>
      </div>
    </div>
  </div>

  <div class="complete-screen" id="completeScreen">
    <div class="complete-icon">🎯</div>
    <div class="complete-title">완료!</div>
    <div class="complete-sub" id="completeSub"></div>
    <div class="result-grid">
      <div class="result-box result-box-correct"><div class="result-num" id="finalCorrect">0</div><div class="result-label">정답</div></div>
      <div class="result-box result-box-wrong"><div class="result-num" id="finalWrong">0</div><div class="result-label">오답</div></div>
    </div>
    <button class="btn-restart" onclick="restartAll()">처음부터</button>
    <button class="btn-wrong-only" id="btnWrongOnly" onclick="reviewWrong()">오답만 복습</button>
  </div>
</div>

<script>
const ALL_CARDS = [
  // ── 도핑방지 ──────────────────────────────
  { part:'도핑방지 · WADA', category:'도핑방지',
    q:'WADA(세계도핑방지기구)에 대해 설명하시오.',
    keywords:['1999년','금지목록','세계도핑방지규약(WADC)'],
    wrongs:['2001년','허용약물 목록','세계체육진흥협약(WASC)'],
    answerText:'스포츠 도핑 근절을 위해 {1999년} 설립된 독립적 국제기구. 도핑방지 정책 수립, {금지목록} 관리, 각국 도핑방지기구 감독. {세계도핑방지규약(WADC)} 제정',
    a:'1999년 설립. 도핑방지 정책 수립, 금지목록 관리, 각국 도핑방지기구 감독. 세계도핑방지규약(WADC) 제정하여 종목·국가 불문 동일 기준 적용' },

  { part:'도핑방지 · 탄 규정', category:'도핑방지',
    q:'IFBB 탄(Tan) 관련 규정을 설명하시오.',
    keywords:['지워질 수 있는','입장 불가','광택·광채·메탈릭 펄'],
    wrongs:['건조될 수 있는','감점 처리','은은한 색상'],
    answerText:'{지워질 수 있는} 탄·브론저 사용 금지. 문지르면 벗겨지면 무대 {입장 불가}. {광택·광채·메탈릭 펄} 함유 제품 전면 금지',
    a:'지워질 수 있는 탄·브론저 금지(벗겨지면 무대 입장 불가). 인공착색·셀프태닝 허용. 에어브러시·캐빈스프레이 태닝 허용. 광택·광채·메탈릭 펄·금색 전면 금지' },

  { part:'도핑방지 · TUE', category:'도핑방지',
    q:'TUE(치료목적사용면책) 면책규정을 설명하시오.',
    keywords:['금지약물','건강상 심각한 손상','치료목적사용면책위원회(TUEC)'],
    wrongs:['허용약물','경기력 저하','한국도핑방지위원회(KADA)'],
    answerText:'선수가 질병·부상 치료 위해 {금지약물}이 필요한 경우 사전 승인 부여. 4가지 조건 중 하나: 미사용 시 {건강상 심각한 손상}. 승인기관: {치료목적사용면책위원회(TUEC)}',
    a:'금지약물이 의학적으로 필요한 경우 사전 심사 후 승인 시 도핑위반 미적용. 4가지 조건 모두 충족 필요. 승인기관: TUEC(KADA와 독립)' },

  { part:'도핑방지 · WADA 구성요소', category:'도핑방지',
    q:'세계도핑방지기구(WADA) 구성요소 4가지를 설명하시오.',
    pool:['세계도핑방지규약(Code)','국제표준(International Standards)','모범규정(Model Rules)','교육 프로그램(Education)'],
    pickCount:3,
    wrongs:['경기규정','선수보호법','금지목록'],
    a:'① 세계도핑방지규약(Code) ② 국제표준(금지목록·검사·TUE 등 6종) ③ 모범규정(각국 도입 표준양식) ④ 교육 프로그램(선수·지도자 대상)' },

  { part:'도핑방지 · 검사 기본권', category:'도핑방지',
    q:'도핑검사 시 선수의 기본권을 설명하시오.',
    pool:['도핑검사관 신분 확인 권리','선수 대리인 1명 동반 권리','합당한 사유 시 도착 연기 신청 권리','시료채취용품 선택·교체 권리','절차 안내 받을 권리'],

    a:'보편성: 성적·능력 관계없이 모든 선수에 동등 적용. 불가분성: 신체 안전권·학습권·성적 자기결정권은 어떤 이유로도 포기시킬 수 없음' },

    pickCount:3,
    wrongs:['경기력 향상','시설 청소 담당','비용 절감'],
    a:'① 참가자의 다양한 욕구에 부응 ② 시설 활용 극대화·프로그램 운영 효율성 ③ 전문 지식으로 정확하고 안전한 운동 지도 ④ 생활체육 확대를 위한 전문 인력 배양' },

  { part:'스포츠윤리 · 성폭력', category:'스포츠윤리',
    q:'성폭력 예방(합숙 포함)을 설명하시오.',
    keywords:['동의 없이 방문 금지','밀폐 공간','보호자·관계자 상주'],
    wrongs:['동의 없이 방문 허용','개방 공간','감독'],
    answerText:'합숙: 선수 숙소 {동의 없이 방문 금지}. {밀폐 공간} 단둘 상황 피하기. 성별 다른 경우 {보호자·관계자 상주}. 신체 접촉 시 동의 구하기',
    a:'합숙: 동의 없이 방문·신체접촉 금지, 음란물 공유 금지, 이성 숙소 출입 금지. 성별 다른 경우 보호자 상주. 훈련장: 동의 구하기, 밀폐 공간 피하기' },

  { part:'스포츠윤리 · 생활체육', category:'스포츠윤리',
    q:'생활체육에 대해 설명하시오.',
    keywords:['자발적','일상적','삶의 질'],
    wrongs:['강제적','비정기적','경기력'],
    answerText:'건강과 체력 증진을 위한 {자발적}이고 {일상적}인 체육활동. 성별·연령·계층 관계없이 전체 대상. {삶의 질}을 높이는 것이 목적',
    a:'건강·체력 증진을 위한 자발적·일상적 체육활동. 신체·정서·사회적 조화 발달 목적. 성별·연령·계층 관계없이 전 사회구성원 대상' },

  { part:'스포츠윤리 · 생활체육 구성요소', category:'스포츠윤리',
    q:'생활체육의 구성 요소 3가지를 설명하시오.',
    keywords:['프로그램','시설','지도자'],
    wrongs:['경기','관중','심판'],
    answerText:'{프로그램}: 참가자 욕구 반영 운동 활동. {시설}: 안전하고 저렴한 공간·기구. {지도자}: 전문 인력. 4가지 시: 홍보 추가',
    a:'① 프로그램(참가자 욕구 반영) ② 시설(안전·저렴한 공간·기구) ③ 지도자(전문 인력). 4가지 묻는 경우: 홍보 추가' },

  { part:'스포츠윤리 · 인권침해', category:'스포츠윤리',
    q:'스포츠 인권침해란?',
    keywords:['존중받을 권리','신체 폭행','명예훼손'],
    wrongs:['차별받을 권리','신체 훈련','명예 향상'],
    answerText:'체육인으로서 {존중받을 권리} 등을 부당하게 빼앗는 모든 행동. {신체 폭행}·협박·폭언, {명예훼손}, 집단 따돌림, 성적 굴욕감 등 포함',
    a:'존중받을 권리·안전할 권리·공정한 권리를 부당하게 빼앗는 행동. 신체 폭행·협박, 반복 욕설, 명예훼손, 심부름 강요, 집단 따돌림, 성적 굴욕감 등' },

  { part:'스포츠윤리 · 폭력', category:'스포츠윤리',
    q:'스포츠 폭력에 관해 설명하시오.',
    keywords:['신체적','정신적','금전적'],
    wrongs:['직업적','생리적','의료적'],
    answerText:'스포츠 영역에서 스포츠인을 대상으로 {신체적}·{정신적}·{금전적} 피해를 가하는 모든 행위. 언어/신체/성/사이버 폭력 등',
    a:'신체적·정신적·금전적 피해를 가하는 모든 행위. 유형: 언어폭력, 신체폭력, 성희롱·성폭력, 디지털성범죄, 사이버폭력, 일상적 통제, 2차 피해' },
];

const CATEGORIES = ['ALL','도핑방지','운동생리학','응급처치','규정/포즈','기능해부학','트레이닝/영양','스포츠윤리'];
const CATEGORY_LABELS = {
  ALL:'전체 (73문제)',
  '도핑방지':'도핑방지',
  '운동생리학':'운동생리학',
  '응급처치':'응급처치',
  '규정/포즈':'규정/포즈',
  '기능해부학':'기능해부학',
  '트레이닝/영양':'트레이닝/영양',
  '스포츠윤리':'스포츠윤리'
};
const LS_KEY = 'mentorone_wrong_kichul_2026_0613';

let currentCards = [], currentIndex = 0;
let correctCount = 0, wrongCount = 0;
let answeredSet = new Set(), wrongSet = new Set();
let currentCategory = 'ALL', currentMode = 'flash';
let blankKeywords = [], blankFilled = [], blankResults = [];
let blankCurrentIdx = 0, blankCardCorrect = true;
let currentAnswerText = '';

function lsLoad() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch { return []; } }
function lsSave(cards) { try { localStorage.setItem(LS_KEY, JSON.stringify(cards)); } catch {} }
function lsAddWrong(card) { const list = lsLoad(); if (!list.find(c => c.q === card.q)) { list.push(card); lsSave(list); } buildTabs(); }
function lsRemoveWrong(q) { lsSave(lsLoad().filter(c => c.q !== q)); buildTabs(); }
function lsClear() { if (!confirm('오답노트를 초기화할까요?')) return; localStorage.removeItem(LS_KEY); buildTabs(); loadCategory('ALL'); }

function init() { buildTabs(); loadCategory('ALL'); }

function buildTabs() {
  const el = document.getElementById('categoryTabs');
  el.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (cat === currentCategory ? ' active' : '');
    btn.textContent = CATEGORY_LABELS[cat];
    btn.onclick = () => loadCategory(cat);
    el.appendChild(btn);
  });
  const wc = lsLoad().length;
  const wb = document.createElement('button');
  wb.className = 'tab tab-wrong' + (currentCategory === 'WRONG' ? ' active' : '');
  wb.innerHTML = `📕 오답노트 ${wc > 0 ? `<span class="wrong-badge">${wc}</span>` : ''}`;
  wb.onclick = () => loadWrongNote();
  el.appendChild(wb);
}

function loadCategory(cat) {
  currentCategory = cat;
  buildTabs();
  currentCards = cat === 'ALL' ? [...ALL_CARDS] : ALL_CARDS.filter(c => c.category === cat);
  resetState();
  document.getElementById('completeScreen').classList.remove('show');
  document.getElementById('wrongNotePanel').style.display = 'none';
  document.getElementById('mainCardArea').style.display = 'block';
  renderCard();
}

function loadWrongNote() {
  currentCategory = 'WRONG'; buildTabs();
  const list = lsLoad();
  document.getElementById('mainCardArea').style.display = 'none';
  document.getElementById('completeScreen').classList.remove('show');
  const panel = document.getElementById('wrongNotePanel');
  panel.style.display = 'block';
  const count = list.length;
  document.getElementById('wrongNoteCount').textContent = count > 0 ? `누적 오답 ${count}문제` : '오답이 없어요 🎉';
  document.getElementById('btnStartWrongReview').style.display = count > 0 ? 'inline-block' : 'none';
  document.getElementById('btnClearWrong').style.display = count > 0 ? 'inline-block' : 'none';
}

function startWrongReview() {
  const list = lsLoad();
  if (!list.length) return;
  currentCards = list.map(q => ALL_CARDS.find(c => c.q === q.q) || q).filter(Boolean);
  resetState();
  document.getElementById('wrongNotePanel').style.display = 'none';
  document.getElementById('mainCardArea').style.display = 'block';
  renderCard();
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById('modeFlash').classList.toggle('active', mode === 'flash');
  document.getElementById('modeBlank').classList.toggle('active', mode === 'blank');
  document.getElementById('flashMode').style.display = mode === 'flash' ? 'block' : 'none';
  document.getElementById('blankMode').style.display = mode === 'blank' ? 'block' : 'none';
  resetState(); renderCard();
}

function resetState() {
  currentIndex = 0; correctCount = 0; wrongCount = 0;
  answeredSet = new Set(); wrongSet = new Set(); updateScoreBadges();
}

function renderCard() { if (!currentCards.length) return; if (currentMode === 'flash') renderFlash(); else renderBlank(); updateProgress(); }

function renderFlash() {
  const card = currentCards[currentIndex];
  document.getElementById('cardInner').classList.remove('flipped');
  document.getElementById('cardPart').textContent = card.part;
  document.getElementById('cardPartBack').textContent = card.part;
  document.getElementById('cardQuestion').textContent = card.q;
  document.getElementById('cardAnswer').innerHTML = card.a.replace(/\n/g,'<br>');
  document.getElementById('flashActionArea').style.display = 'flex';
  document.getElementById('flashNextArea').style.display = 'none';
}

function markCard(isCorrect) {
  document.getElementById('cardInner').classList.add('flipped');
  document.getElementById('flashActionArea').style.display = 'none';
  document.getElementById('flashNextArea').style.display = 'flex';
  if (!answeredSet.has(currentIndex)) {
    answeredSet.add(currentIndex);
    const card = currentCards[currentIndex];
    if (isCorrect) { correctCount++; lsRemoveWrong(card.q); }
    else { wrongCount++; wrongSet.add(currentIndex); lsAddWrong(card); }
    updateScoreBadges();
  }
}

function renderBlank() {
  const card = currentCards[currentIndex];
  if (card.pool) {
    const poolShuffled = shuffle([...card.pool]);
    const blanks = poolShuffled.slice(0, card.pickCount || 3);
    const blanksSet = new Set(blanks);
    blankKeywords = blanks;
    currentAnswerText = card.pool.map(item => blanksSet.has(item) ? `{${item}}` : item).join(' / ');
  } else {
    blankKeywords = card.keywords.slice();
    currentAnswerText = card.answerText;
  }
  blankFilled = new Array(blankKeywords.length).fill(false);
  blankResults = new Array(blankKeywords.length).fill(null);
  blankCurrentIdx = 0; blankCardCorrect = true;
  document.getElementById('blankPart').textContent = card.part;
  document.getElementById('blankQuestion').textContent = card.q;
  document.getElementById('blankNextArea').style.display = 'none';
  renderTokens(); renderChoices();
}

function renderTokens() {
  const container = document.getElementById('answerTokens');
  container.innerHTML = '';
  const parts = currentAnswerText.split(/(\{[^}]+\})/);
  let kwIdx = 0;
  parts.forEach(part => {
    if (part.startsWith('{') && part.endsWith('}')) {
      const kw = part.slice(1,-1); const idx = kwIdx++;
      const span = document.createElement('span');
      if (blankFilled[idx]) {
        span.textContent = kw;
        span.className = 'token ' + (blankResults[idx] === 'wrong' ? 'token-wrong' : 'token-correct');
      } else if (idx === blankCurrentIdx) {
        span.className = 'token token-blank active'; span.innerHTML = '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;';
      } else {
        span.className = 'token token-blank'; span.innerHTML = '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;';
      }
      container.appendChild(span);
    } else if (part.trim()) {
      part.split('\n').forEach((line, i) => {
        if (i > 0) container.appendChild(document.createElement('br'));
        if (line) { const span = document.createElement('span'); span.className = 'token token-sep'; span.textContent = line; container.appendChild(span); }
      });
    }
  });
}

function renderChoices() {
  const card = currentCards[currentIndex];
  const container = document.getElementById('choicesArea');
  container.innerHTML = '';
  if (blankCurrentIdx >= blankKeywords.length) return;
  const correct = blankKeywords[blankCurrentIdx];
  const seen = new Set([correct]); const wrongs = [];
  if (card.pool) {
    const blanksSet = new Set(blankKeywords);
    for (const k of shuffle(card.pool.filter(item => !blanksSet.has(item)))) {
      if (!seen.has(k)) { seen.add(k); wrongs.push(k); }
      if (wrongs.length === 3) break;
    }
  }
  if (wrongs.length < 3 && card.wrongs) {
    for (const k of shuffle([...card.wrongs])) {
      if (!seen.has(k)) { seen.add(k); wrongs.push(k); }
      if (wrongs.length === 3) break;
    }
  }
  shuffle([correct, ...wrongs]).forEach(kw => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn'; btn.textContent = kw;
    btn.onclick = () => selectChoice(kw, correct, btn);
    container.appendChild(btn);
  });
}

function selectChoice(selected, correct, btnEl) {
  document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
  if (selected === correct) {
    btnEl.classList.add('flash-correct');
    blankFilled[blankCurrentIdx] = true; blankResults[blankCurrentIdx] = 'correct'; blankCurrentIdx++;
    setTimeout(() => { if (blankCurrentIdx >= blankKeywords.length) finishBlankCard(); else { renderTokens(); renderChoices(); } }, 400);
  } else {
    blankCardCorrect = false; btnEl.classList.add('flash-wrong');
    document.querySelectorAll('.choice-btn').forEach(b => { if (b.textContent === correct) b.classList.add('flash-correct'); });
    setTimeout(() => {
      blankFilled[blankCurrentIdx] = true; blankResults[blankCurrentIdx] = 'wrong'; blankCurrentIdx++;
      if (blankCurrentIdx >= blankKeywords.length) finishBlankCard(); else { renderTokens(); renderChoices(); }
    }, 1000);
  }
}

function finishBlankCard() {
  if (!answeredSet.has(currentIndex)) {
    answeredSet.add(currentIndex);
    const card = currentCards[currentIndex];
    if (blankCardCorrect) { correctCount++; lsRemoveWrong(card.q); }
    else { wrongCount++; wrongSet.add(currentIndex); lsAddWrong(card); }
    updateScoreBadges();
  }
  renderTokens();
  document.getElementById('choicesArea').innerHTML = '';
  document.getElementById('blankNextArea').style.display = 'flex';
}

function nextCard() {
  if (currentIndex < currentCards.length - 1) { currentIndex++; renderCard(); }
  else { if (answeredSet.size >= currentCards.length) showComplete(); else { currentIndex = 0; renderCard(); } }
}
function prevCard() { if (currentIndex > 0) { currentIndex--; renderCard(); } }
function shuffleCards() { shuffle(currentCards); resetState(); renderCard(); }
function shuffle(arr) { for (let i = arr.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

function updateProgress() {
  const total = currentCards.length;
  document.getElementById('progressFill').style.width = total ? ((currentIndex+1)/total*100).toFixed(0)+'%' : '0%';
  document.getElementById('progressCount').textContent = `${currentIndex+1} / ${total}`;
  document.getElementById('progressLabel').textContent = currentCards[currentIndex]?.part || '';
}
function updateScoreBadges() { document.getElementById('correctCount').textContent = correctCount; document.getElementById('wrongCount').textContent = wrongCount; }

function showComplete() {
  document.getElementById('mainCardArea').style.display = 'none';
  document.getElementById('completeScreen').classList.add('show');
  document.getElementById('finalCorrect').textContent = correctCount;
  document.getElementById('finalWrong').textContent = wrongCount;
  document.getElementById('completeSub').textContent = `정답률 ${Math.round(correctCount/currentCards.length*100)}% · 총 ${currentCards.length}문제`;
  document.getElementById('btnWrongOnly').style.display = wrongSet.size > 0 ? 'inline-block' : 'none';
}
function restartAll() { loadCategory(currentCategory); }
function reviewWrong() { currentCards = [...wrongSet].map(i => currentCards[i]); resetState(); document.getElementById('completeScreen').classList.remove('show'); document.getElementById('mainCardArea').style.display = 'block'; renderCard(); }

init();
</script>
