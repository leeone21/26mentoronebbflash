<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생활스포츠&스포츠윤리 플래시카드 | 멘토원</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1B2A4A; --navy-light: #243660;
    --gold: #C5963A; --gold-light: #E8B84B;
    --white: #FFFFFF; --gray: #8A8F9E;
    --card-radius: 20px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Noto Sans KR',sans-serif; background:var(--navy); min-height:100vh; color:var(--white); overflow-x:hidden; }
  body::before { content:''; position:fixed; inset:0; background: radial-gradient(ellipse 60% 40% at 80% 20%,rgba(197,150,58,.08) 0%,transparent 60%), radial-gradient(ellipse 50% 60% at 10% 80%,rgba(36,54,96,.6) 0%,transparent 60%); pointer-events:none; z-index:0; }
  .app { position:relative; z-index:1; max-width:760px; margin:0 auto; padding:24px 20px 60px; }

  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  .logo { font-size:11px; font-weight:700; letter-spacing:3px; color:var(--gold); text-transform:uppercase; }
  .logo span { color:var(--gray); font-weight:300; }
  .header-title { font-size:13px; color:var(--gray); }

  .mode-toggle { display:flex; background:rgba(255,255,255,.06); border-radius:10px; padding:4px; margin-bottom:20px; }
  .mode-btn { flex:1; padding:8px 0; border:none; border-radius:7px; background:transparent; color:var(--gray); font-family:'Noto Sans KR',sans-serif; font-size:13px; font-weight:500; cursor:pointer; transition:all .2s; }
  .mode-btn.active { background:var(--gold); color:var(--navy); font-weight:700; }

  .category-tabs { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
  .tab { padding:7px 14px; border-radius:100px; border:1px solid rgba(255,255,255,.12); background:transparent; color:var(--gray); font-size:12px; font-weight:500; font-family:'Noto Sans KR',sans-serif; cursor:pointer; transition:all .2s; }
  .tab:hover { border-color:var(--gold); color:var(--gold-light); }
  .tab.active { background:var(--gold); border-color:var(--gold); color:var(--navy); font-weight:700; }

  .progress-bar-wrap { margin-bottom:16px; }
  .progress-info { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .progress-label { font-size:12px; color:var(--gray); }
  .progress-count { font-family:'DM Mono',monospace; font-size:13px; color:var(--gold); }
  .progress-track { height:3px; background:rgba(255,255,255,.08); border-radius:99px; overflow:hidden; }
  .progress-fill { height:100%; background:linear-gradient(90deg,var(--gold),var(--gold-light)); border-radius:99px; transition:width .4s ease; }

  .score-badges { display:flex; gap:10px; margin-bottom:24px; }
  .badge { display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:8px; font-size:12px; font-weight:600; font-family:'DM Mono',monospace; }
  .badge-correct { background:rgba(45,122,95,.15); border:1px solid rgba(45,122,95,.3); color:#5EC49A; }
  .badge-wrong { background:rgba(184,50,50,.12); border:1px solid rgba(184,50,50,.25); color:#E07070; }
  .badge-dot { width:6px; height:6px; border-radius:50%; }
  .badge-correct .badge-dot { background:#5EC49A; }
  .badge-wrong .badge-dot { background:#E07070; }

  .card-container { perspective:1200px; margin-bottom:20px; }
  .card-inner { position:relative; width:100%; min-height:260px; transform-style:preserve-3d; transition:transform .55s cubic-bezier(.4,0,.2,1); }
  .card-inner.flipped { transform:rotateY(180deg); }
  .card-face { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:var(--card-radius); padding:32px 36px; display:flex; flex-direction:column; min-height:260px; }
  .card-front { background:var(--white); color:var(--navy); }
  .card-front .card-part { font-size:10px; font-weight:700; letter-spacing:2.5px; color:var(--gold); text-transform:uppercase; margin-bottom:16px; }
  .card-front .card-question { font-size:19px; font-weight:700; color:var(--navy); line-height:1.5; flex:1; display:flex; align-items:center; }
  .card-back { background:var(--navy-light); border:1px solid rgba(197,150,58,.25); transform:rotateY(180deg); overflow-y:auto; }
  .card-back .card-part { font-size:10px; font-weight:700; letter-spacing:2.5px; color:var(--gold); text-transform:uppercase; margin-bottom:12px; }
  .card-back .answer-label { font-size:11px; color:var(--gray); margin-bottom:10px; letter-spacing:1px; }
  .card-back .card-answer { font-size:15px; font-weight:500; line-height:1.8; color:var(--white); flex:1; }

  .blank-card { background:var(--white); border-radius:var(--card-radius); padding:32px 36px; margin-bottom:20px; min-height:220px; display:flex; flex-direction:column; }
  .blank-card .card-part { font-size:10px; font-weight:700; letter-spacing:2.5px; color:var(--gold); text-transform:uppercase; margin-bottom:16px; }
  .blank-card .card-question { font-size:17px; font-weight:700; color:var(--navy); margin-bottom:24px; line-height:1.5; }
  .answer-tokens { display:flex; flex-wrap:wrap; gap:8px; align-items:center; flex:1; }
  .token { display:inline-flex; align-items:center; justify-content:center; padding:8px 14px; border-radius:8px; font-size:14px; font-weight:600; min-width:70px; text-align:center; line-height:1.4; }
  .token-blank { background:#F0F2F8; color:transparent; border:2px dashed #C8CCE0; min-width:90px; }
  .token-blank.active { background:#EBF0FF; border:2px dashed #7B96E8; animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{border-color:#7B96E8} 50%{border-color:#3A5FD4} }
  .token-correct { background:rgba(45,122,95,.12); color:#1A6647; border:2px solid rgba(45,122,95,.35); }
  .token-wrong { background:rgba(184,50,50,.1); color:#8B1A1A; border:2px solid rgba(184,50,50,.3); }
  .token-sep { background:transparent; color:var(--navy); font-size:15px; font-weight:400; padding:4px; min-width:auto; }

  .choices-area { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:20px; }
  .choice-btn { padding:10px 18px; border-radius:10px; border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.06); color:var(--white); font-family:'Noto Sans KR',sans-serif; font-size:14px; font-weight:500; cursor:pointer; transition:all .18s; }
  .choice-btn:hover { background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.3); transform:translateY(-1px); }
  .choice-btn:disabled { opacity:.4; cursor:default; transform:none; }
  .choice-btn.flash-wrong { background:rgba(184,50,50,.25); border-color:rgba(184,50,50,.5); color:#E07070; }
  .choice-btn.flash-correct { background:rgba(45,122,95,.2); border-color:rgba(45,122,95,.5); color:#5EC49A; }

  .action-area { display:flex; gap:12px; margin-bottom:16px; }
  .btn { flex:1; padding:13px; border-radius:12px; border:none; font-family:'Noto Sans KR',sans-serif; font-size:14px; font-weight:700; cursor:pointer; transition:all .2s; display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn:active { transform:scale(.97); }
  .btn-wrong { background:rgba(184,50,50,.12); border:1px solid rgba(184,50,50,.3); color:#E07070; }
  .btn-wrong:hover { background:rgba(184,50,50,.2); }
  .btn-correct { background:rgba(45,122,95,.15); border:1px solid rgba(45,122,95,.35); color:#5EC49A; }
  .btn-correct:hover { background:rgba(45,122,95,.25); }
  .btn-next { background:var(--gold); color:var(--navy); font-weight:700; }
  .btn-next:hover { background:var(--gold-light); }

  .nav-area { display:flex; gap:10px; justify-content:center; }
  .btn-nav { padding:10px 20px; border-radius:10px; border:1px solid rgba(255,255,255,.12); background:transparent; color:var(--gray); font-family:'Noto Sans KR',sans-serif; font-size:13px; cursor:pointer; transition:all .2s; }
  .btn-nav:hover { border-color:rgba(255,255,255,.3); color:var(--white); }
  .btn-shuffle { padding:10px 16px; border-radius:10px; border:1px solid rgba(197,150,58,.2); background:transparent; color:var(--gold); font-family:'Noto Sans KR',sans-serif; font-size:12px; cursor:pointer; transition:all .2s; }
  .btn-shuffle:hover { background:rgba(197,150,58,.1); }

  .complete-screen { display:none; text-align:center; padding:48px 20px; }
  .complete-screen.show { display:block; }
  .complete-icon { font-size:48px; margin-bottom:16px; }
  .complete-title { font-size:24px; font-weight:700; margin-bottom:8px; }
  .complete-sub { color:var(--gray); font-size:14px; margin-bottom:32px; }
  .result-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:32px; }
  .result-box { padding:20px; border-radius:14px; text-align:center; }
  .result-box-correct { background:rgba(45,122,95,.12); border:1px solid rgba(45,122,95,.25); }
  .result-box-wrong { background:rgba(184,50,50,.1); border:1px solid rgba(184,50,50,.2); }
  .result-num { font-family:'DM Mono',monospace; font-size:36px; font-weight:500; margin-bottom:4px; }
  .result-box-correct .result-num { color:#5EC49A; }
  .result-box-wrong .result-num { color:#E07070; }
  .result-label { font-size:12px; color:var(--gray); }
  .btn-restart { padding:14px 32px; border-radius:12px; border:none; background:var(--gold); color:var(--navy); font-family:'Noto Sans KR',sans-serif; font-size:15px; font-weight:700; cursor:pointer; margin-right:10px; }
  .btn-restart:hover { background:var(--gold-light); }
  .btn-wrong-only { padding:14px 24px; border-radius:12px; border:1px solid rgba(184,50,50,.3); background:transparent; color:#E07070; font-family:'Noto Sans KR',sans-serif; font-size:15px; font-weight:700; cursor:pointer; }
  .btn-wrong-only:hover { background:rgba(184,50,50,.1); }

  .tab.tab-wrong { border-color: rgba(184,50,50,.3); color: #E07070; }
  .tab.tab-wrong:hover { border-color: rgba(184,50,50,.6); color: #E07070; }
  .tab.tab-wrong.active { background: #B83232; border-color: #B83232; color: var(--white); }
  .wrong-badge { display:inline-flex; align-items:center; justify-content:center; background:#B83232; color:var(--white); font-size:10px; font-weight:700; width:18px; height:18px; border-radius:50%; margin-left:4px; vertical-align:middle; }
  .tab.tab-wrong.active .wrong-badge { background:rgba(255,255,255,.3); }

  .wrong-note-card { background:var(--white); border-radius:var(--card-radius); padding:40px 36px; text-align:center; margin-bottom:20px; }
  .wrong-note-title { font-size:20px; font-weight:700; color:var(--navy); margin-bottom:16px; }
  .wrong-note-count { font-size:28px; font-weight:900; color:#B83232; margin-bottom:12px; }
  .wrong-note-desc { font-size:13px; color:var(--gray); line-height:1.7; margin-bottom:28px; }
  .wrong-note-btns { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .btn-clear-wrong { padding:13px 20px; border-radius:12px; border:1px solid rgba(184,50,50,.3); background:transparent; color:#E07070; font-family:'Noto Sans KR',sans-serif; font-size:14px; font-weight:600; cursor:pointer; transition:all .2s; }
  .btn-clear-wrong:hover { background:rgba(184,50,50,.1); }

  @media(max-width:480px){
    .card-face,.blank-card{padding:24px 20px;}
    .card-front .card-question,.blank-card .card-question{font-size:16px;}
    .token{font-size:13px;padding:7px 10px;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <a href="index.html" style="font-size:12px;color:var(--gray);text-decoration:none;display:flex;align-items:center;gap:4px;transition:color .2s;" onmouseover="this.style.color='var(--gold)'" onmouseout="this.style.color='var(--gray)'">← 홈</a>
    <div class="header-title">생활스포츠&스포츠윤리 플래시카드</div>
  </div>

  <div class="mode-toggle">
    <button class="mode-btn active" id="modeFlash" onclick="setMode('flash')">📋 플래시카드</button>
    <button class="mode-btn" id="modeBlank" onclick="setMode('blank')">✏️ 빈칸 채우기</button>
  </div>

  <div class="category-tabs" id="categoryTabs"></div>

  <div class="progress-bar-wrap">
    <div class="progress-info">
      <span class="progress-label" id="progressLabel"></span>
      <span class="progress-count" id="progressCount">0 / 0</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>

  <div class="score-badges">
    <div class="badge badge-correct"><div class="badge-dot"></div><span id="correctCount">0</span> 정답</div>
    <div class="badge badge-wrong"><div class="badge-dot"></div><span id="wrongCount">0</span> 오답</div>
  </div>

  <div id="mainCardArea">
    <div id="flashMode">
      <div class="card-container">
        <div class="card-inner" id="cardInner" onclick="flipCard()">
          <div class="card-face card-front">
            <div class="card-part" id="cardPart"></div>
            <div class="card-question" id="cardQuestion"></div>
          </div>
          <div class="card-face card-back">
            <div class="card-part" id="cardPartBack"></div>
            <div class="answer-label">ANSWER</div>
            <div class="card-answer" id="cardAnswer"></div>
          </div>
        </div>
      </div>
      <div class="action-area" id="flashActionArea">
        <button class="btn btn-wrong" onclick="markCard(false)">✗ 모르겠어요</button>
        <button class="btn btn-correct" onclick="markCard(true)">✓ 알겠어요</button>
      </div>
      <div class="action-area" id="flashNextArea" style="display:none;">
        <button class="btn btn-next" onclick="nextCard()">다음으로 →</button>
      </div>
    </div>

    <div id="blankMode" style="display:none;">
      <div class="blank-card">
        <div class="card-part" id="blankPart"></div>
        <div class="card-question" id="blankQuestion"></div>
        <div class="answer-tokens" id="answerTokens"></div>
      </div>
      <div class="choices-area" id="choicesArea"></div>
      <div class="action-area" id="blankNextArea" style="display:none;">
        <button class="btn btn-next" onclick="nextCard()">다음으로 →</button>
      </div>
    </div>

    <div class="nav-area">
      <button class="btn-nav" onclick="prevCard()">← 이전</button>
      <button class="btn-shuffle" onclick="shuffleCards()">🔀 섞기</button>
      <button class="btn-nav" onclick="nextCard()">다음 →</button>
    </div>
  </div>

  <div id="wrongNotePanel" style="display:none;">
    <div class="wrong-note-card">
      <div class="wrong-note-title">📕 오답노트</div>
      <div class="wrong-note-count" id="wrongNoteCount">불러오는 중...</div>
      <div class="wrong-note-desc">틀린 문제들이 자동으로 저장됩니다.<br>맞힌 문제는 자동으로 제거돼요.</div>
      <div class="wrong-note-btns">
        <button class="btn btn-next" id="btnStartWrongReview" onclick="startWrongReview()">복습 시작 →</button>
        <button class="btn-clear-wrong" id="btnClearWrong" onclick="lsClear()">🗑 초기화</button>
      </div>
    </div>
  </div>

  <div class="complete-screen" id="completeScreen">
    <div class="complete-icon">🎯</div>
    <div class="complete-title">완료!</div>
    <div class="complete-sub" id="completeSub"></div>
    <div class="result-grid">
      <div class="result-box result-box-correct"><div class="result-num" id="finalCorrect">0</div><div class="result-label">정답</div></div>
      <div class="result-box result-box-wrong"><div class="result-num" id="finalWrong">0</div><div class="result-label">오답</div></div>
    </div>
    <button class="btn-restart" onclick="restartAll()">처음부터</button>
    <button class="btn-wrong-only" id="btnWrongOnly" onclick="reviewWrong()">오답만 복습</button>
  </div>
</div>

<script>
const ALL_CARDS = [

  // ===== PART 1 · 생활체육 기본 개념 =====

  {

    keywords: ['여가', '조화'],

    wrongs: ['승리', '억제', '경쟁'],
    answerText: '활동 그 자체의 {즐거움}과 기쁨 / 잠재적 욕구를 자연스럽게 {표현·발산}',

// ── localStorage ──
function lsGet() { try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch { return []; } }
function lsSave(arr) { localStorage.setItem(LS_KEY, JSON.stringify(arr)); }
function lsClear() { if (confirm('오답노트를 초기화하시겠습니까?')) { localStorage.removeItem(LS_KEY); location.reload(); } }

// ── Pool 카드 렌더링 ──
function renderBlank(card) {
  if (card.pool) {
    const shuffled = [...card.pool].sort(() => Math.random() - 0.5);
    const picked = shuffled.slice(0, card.pickCount);
    const notPicked = card.pool.filter(x => !picked.includes(x));
    blankKeywords = picked;
    currentAnswerText = picked.map((_, i) => `{${i}}`).join(' / ');
    const extraWrongs = notPicked.slice(0, Math.max(0, 4 - card.wrongs.length));
    const allWrongs = [...card.wrongs, ...extraWrongs];
    return { keywords: picked, answerText: currentAnswerText, wrongs: allWrongs };
  } else {
    blankKeywords = card.keywords;
    currentAnswerText = card.answerText;
    return { keywords: card.keywords, answerText: card.answerText, wrongs: card.wrongs };
  }
}

// ── 카드 초기화 ──
function getFilteredCards() {
  if (currentCategory === 'ALL') return [...ALL_CARDS];
  if (currentCategory === 'WRONG') {
    const ids = lsGet();
    return ALL_CARDS.filter((_, i) => ids.includes(i));
  }
  return ALL_CARDS.filter(c => c.category === currentCategory);
}

function initCards(cards) {
  currentCards = cards;
  currentIndex = 0;
  correctCount = 0;
  wrongCount = 0;
  answeredSet = new Set();
  wrongSet = new Set();
  updateScoreBadges();
  renderCard();
}

function shuffleCards() {
  currentCards = [...currentCards].sort(() => Math.random() - 0.5);
  currentIndex = 0;
  answeredSet = new Set();
  renderCard();
}

// ── 탭 렌더링 ──
function renderTabs() {
  const container = document.getElementById('categoryTabs');
  const wrongIds = lsGet();
  container.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (cat === currentCategory ? ' active' : '');
    btn.textContent = CATEGORY_LABELS[cat] || cat;
    btn.onclick = () => { currentCategory = cat; renderTabs(); initCards(getFilteredCards()); };
    container.appendChild(btn);
  });
  if (wrongIds.length > 0) {
    const btn = document.createElement('button');
    btn.className = 'tab tab-wrong' + (currentCategory === 'WRONG' ? ' active' : '');
    btn.innerHTML = `오답노트 <span class="wrong-badge">${wrongIds.length}</span>`;
    btn.onclick = () => { currentCategory = 'WRONG'; renderTabs(); initCards(getFilteredCards()); };
    container.appendChild(btn);
  }
}

// ── URL 파라미터: wrongnote 모드 ──
function checkUrlMode() {
  const params = new URLSearchParams(location.search);
  if (params.get('mode') === 'wrongnote') {
    const wrongIds = lsGet();
    if (wrongIds.length > 0) {
      currentCategory = 'WRONG';
      renderTabs();
      showWrongNotePanel();
    } else {
      renderTabs();
      initCards(getFilteredCards());
    }
  } else {
    renderTabs();
    initCards(getFilteredCards());
  }
}

function showWrongNotePanel() {
  const wrongIds = lsGet();
  document.getElementById('mainCardArea').style.display = 'none';
  document.getElementById('completeScreen').classList.remove('show');
  document.getElementById('wrongNotePanel').style.display = 'block';
  document.getElementById('wrongNoteCount').textContent = `${wrongIds.length}문제`;
}

function startWrongReview() {
  document.getElementById('wrongNotePanel').style.display = 'none';
  document.getElementById('mainCardArea').style.display = 'block';
  initCards(getFilteredCards());
}

// ── 카드 렌더링 ──
function renderCard() {
  if (currentCards.length === 0) return;
  const done = answeredSet.size;
  const total = currentCards.length;
  document.getElementById('progressLabel').textContent = `${currentCategory === 'WRONG' ? '오답 복습' : (CATEGORY_LABELS[currentCategory] || currentCategory)}`;
  document.getElementById('progressCount').textContent = `${done} / ${total}`;
  document.getElementById('progressFill').style.width = `${total ? (done / total) * 100 : 0}%`;

  if (currentMode === 'flash') renderFlashCard();
  else renderBlankCard();
}

function renderFlashCard() {
  const card = currentCards[currentIndex];
  document.getElementById('cardPart').textContent = card.part;
  document.getElementById('cardPartBack').textContent = card.part;
  document.getElementById('cardQuestion').textContent = card.q;
  document.getElementById('cardAnswer').textContent = card.a;
  const inner = document.getElementById('cardInner');
  inner.classList.remove('flipped');
  document.getElementById('flashActionArea').style.display = 'flex';
  document.getElementById('flashNextArea').style.display = 'none';
}

function flipCard() {
  document.getElementById('cardInner').classList.toggle('flipped');
}

function renderBlankCard() {
  const card = currentCards[currentIndex];
  const { keywords, answerText, wrongs } = renderBlank(card);
  blankKeywords = keywords;
  blankFilled = new Array(keywords.length).fill(null);
  blankResults = new Array(keywords.length).fill(null);
  blankCurrentIdx = 0;
  blankCardCorrect = true;
  currentAnswerText = answerText;

  document.getElementById('blankPart').textContent = card.part;
  document.getElementById('blankQuestion').textContent = card.q;
  document.getElementById('blankNextArea').style.display = 'none';

  renderTokens();
  renderChoices(keywords, wrongs);
}

function renderTokens() {
  const container = document.getElementById('answerTokens');
  container.innerHTML = '';
  const parts = currentAnswerText.split(/(\{[^}]+\})/);
  let blankIdx = 0;
  parts.forEach(part => {
    const m = part.match(/^\{([^}]+)\}$/);
    if (m) {
      const idx = blankIdx++;
      const token = document.createElement('span');
      if (blankResults[idx] === null) {
        token.className = 'token token-blank' + (idx === blankCurrentIdx ? ' active' : '');
        token.textContent = blankFilled[idx] || '　　　';
      } else if (blankResults[idx] === true) {
        token.className = 'token token-correct';
        token.textContent = blankFilled[idx];
      } else {
        token.className = 'token token-wrong';
        token.textContent = blankFilled[idx];
      }
      container.appendChild(token);
    } else if (part.trim()) {
      const sep = document.createElement('span');
      sep.className = 'token token-sep';
      sep.textContent = part;
      container.appendChild(sep);
    }
  });
}

function renderChoices(keywords, wrongs) {
  const container = document.getElementById('choicesArea');
  container.innerHTML = '';
  const correct = keywords[blankCurrentIdx];
  const pool = [correct, ...wrongs].sort(() => Math.random() - 0.5).slice(0, 4);
  if (!pool.includes(correct)) { pool[0] = correct; pool.sort(() => Math.random() - 0.5); }
  pool.forEach(choice => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = choice;
    btn.onclick = () => handleChoice(choice, correct, btn);
    container.appendChild(btn);
  });
}

function handleChoice(choice, correct, btn) {
  const isCorrect = (choice === correct);
  document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
  btn.classList.add(isCorrect ? 'flash-correct' : 'flash-wrong');
  if (!isCorrect) {
    blankCardCorrect = false;
    document.querySelectorAll('.choice-btn').forEach(b => {
      if (b.textContent === correct) b.classList.add('flash-correct');
    });
  }
  blankFilled[blankCurrentIdx] = choice;
  blankResults[blankCurrentIdx] = isCorrect;
  renderTokens();

  setTimeout(() => {
    blankCurrentIdx++;
    if (blankCurrentIdx < blankKeywords.length) {
      renderTokens();
      renderChoices(blankKeywords, currentCards[currentIndex].wrongs || []);
    } else {
      answeredSet.add(currentIndex);
      if (!blankCardCorrect) {
        wrongSet.add(currentIndex);
        wrongCount++;
        saveWrong(currentIndex);
      } else {
        correctCount++;
        removeWrong(currentIndex);
      }
      updateScoreBadges();
      renderCard();
      document.getElementById('blankNextArea').style.display = 'flex';
    }
  }, 600);
}

// ── 플래시카드 정답/오답 ──
function markCard(isCorrect) {
  answeredSet.add(currentIndex);
  if (isCorrect) {
    correctCount++;
    removeWrong(currentIndex);
  } else {
    wrongCount++;
    wrongSet.add(currentIndex);
    saveWrong(currentIndex);
  }
  updateScoreBadges();
  renderCard();
  document.getElementById('flashActionArea').style.display = 'none';
  document.getElementById('flashNextArea').style.display = 'flex';
}

// ── 오답 저장 ──
function saveWrong(idx) {
  const globalIdx = ALL_CARDS.indexOf(currentCards[idx]);
  if (globalIdx === -1) return;
  const arr = lsGet();
  if (!arr.includes(globalIdx)) { arr.push(globalIdx); lsSave(arr); }
}
function removeWrong(idx) {
  const globalIdx = ALL_CARDS.indexOf(currentCards[idx]);
  if (globalIdx === -1) return;
  const arr = lsGet().filter(i => i !== globalIdx);
  lsSave(arr);
}

// ── 네비게이션 ──
function nextCard() {
  if (answeredSet.size === currentCards.length) { showComplete(); return; }
  do { currentIndex = (currentIndex + 1) % currentCards.length; }
  while (answeredSet.has(currentIndex) && answeredSet.size < currentCards.length);
  renderCard();
  document.getElementById('flashActionArea').style.display = 'flex';
  document.getElementById('flashNextArea').style.display = 'none';
}

function prevCard() {
  currentIndex = (currentIndex - 1 + currentCards.length) % currentCards.length;
  renderCard();
  document.getElementById('flashActionArea').style.display = 'flex';
  document.getElementById('flashNextArea').style.display = 'none';
}

// ── 완료 화면 ──
function showComplete() {
  document.getElementById('mainCardArea').style.display = 'none';
  document.getElementById('completeScreen').classList.add('show');
  document.getElementById('finalCorrect').textContent = correctCount;
  document.getElementById('finalWrong').textContent = wrongCount;
  document.getElementById('completeSub').textContent = `총 ${currentCards.length}문제 완료!`;
  const btn = document.getElementById('btnWrongOnly');
  btn.style.display = wrongSet.size > 0 ? 'inline-block' : 'none';
}

function restartAll() {
  document.getElementById('completeScreen').classList.remove('show');
  document.getElementById('mainCardArea').style.display = 'block';
  initCards(getFilteredCards());
}

function reviewWrong() {
  document.getElementById('completeScreen').classList.remove('show');
  document.getElementById('mainCardArea').style.display = 'block';
  const wrongCards = [...wrongSet].map(i => currentCards[i]);
  initCards(wrongCards);
}

// ── 모드 전환 ──
function setMode(mode) {
  currentMode = mode;
  document.getElementById('modeFlash').classList.toggle('active', mode === 'flash');
  document.getElementById('modeBlank').classList.toggle('active', mode === 'blank');
  document.getElementById('flashMode').style.display = mode === 'flash' ? 'block' : 'none';
  document.getElementById('blankMode').style.display = mode === 'blank' ? 'block' : 'none';
  renderCard();
}

// ── 점수 배지 ──
function updateScoreBadges() {
  document.getElementById('correctCount').textContent = correctCount;
  document.getElementById('wrongCount').textContent = wrongCount;
}

checkUrlMode();
</script>
