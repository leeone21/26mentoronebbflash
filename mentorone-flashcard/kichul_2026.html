<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>'26 실기 구술 기출문제 | 멘토원</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1B2A4A;
    --navy-light: #243660;
    --gold: #C5963A;
    --gold-light: #E8B84B;
    --cream: #F7F3EC;
    --white: #FFFFFF;
    --gray: #8A8F9E;
    --gray-light: #E8EAF0;
    --red: #C0392B;
    --red-light: #E74C3C;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--navy);
    min-height: 100vh;
    color: var(--white);
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 80% 20%, rgba(192,57,43,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 50% 60% at 10% 80%, rgba(36,54,96,0.6) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  /* 헤더 */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 36px;
  }

  .back-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--gray);
    text-decoration: none;
    border: 1px solid rgba(255,255,255,0.1);
    padding: 7px 14px;
    border-radius: 100px;
    transition: all 0.2s;
  }

  .back-btn:hover {
    color: var(--white);
    border-color: rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.05);
  }

  .logo {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--gold);
    text-transform: uppercase;
  }

  .logo span { color: var(--gray); font-weight: 300; }

  /* 페이지 타이틀 */
  .page-hero {
    margin-bottom: 40px;
  }

  .page-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #FF8080;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .page-title {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: -0.5px;
    line-height: 1.3;
    margin-bottom: 8px;
  }

  .page-sub {
    font-size: 13px;
    color: var(--gray);
    line-height: 1.6;
  }

  /* 시험 날짜 카드 */
  .date-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .date-card {
    display: flex;
    align-items: center;
    text-decoration: none;
    background: rgba(192,57,43,0.08);
    border: 1px solid rgba(192,57,43,0.25);
    border-radius: 18px;
    padding: 22px 24px;
    transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
    position: relative;
    overflow: hidden;
  }

  .date-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, var(--red-light), var(--red));
    border-radius: 0 2px 2px 0;
  }

  .date-card:hover {
    background: rgba(192,57,43,0.14);
    border-color: rgba(192,57,43,0.45);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(192,57,43,0.15);
  }

  .date-card:active { transform: translateY(0); }

  .date-icon {
    font-size: 28px;
    margin-right: 18px;
    flex-shrink: 0;
  }

  .date-info {
    flex: 1;
  }

  .date-badge-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }

  .new-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #FF8080;
    background: rgba(192,57,43,0.2);
    border: 1px solid rgba(192,57,43,0.4);
    padding: 3px 8px 3px 6px;
    border-radius: 100px;
    text-transform: uppercase;
  }

  .new-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #FF8080;
    animation: blink 1.2s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  .date-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--white);
    margin-bottom: 4px;
    letter-spacing: -0.2px;
  }

  .date-meta {
    font-size: 12px;
    color: var(--gray);
  }

  .date-arrow {
    font-size: 16px;
    color: rgba(255,128,128,0.6);
    flex-shrink: 0;
    margin-left: 12px;
    transition: transform 0.2s, color 0.2s;
  }

  .date-card:hover .date-arrow {
    transform: translateX(4px);
    color: #FF8080;
  }

  /* 준비중 */
  .date-card.coming {
    opacity: 0.4;
    cursor: not-allowed;
    pointer-events: none;
  }

  .coming-chip {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--gray);
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 3px 8px;
    border-radius: 100px;
  }

  /* 섹션 헤더 */
  .section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--gray);
    text-transform: uppercase;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  /* 푸터 */
  .footer {
    text-align: center;
    margin-top: 48px;
    padding-top: 24px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  .footer-logo {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .footer-logo span { color: var(--gray); font-weight: 300; }

  .footer-text {
    font-size: 11px;
    color: var(--gray);
    opacity: 0.6;
  }

  @media (max-width: 480px) {
    .page-title { font-size: 22px; }
    .date-card { padding: 18px 18px; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- 헤더 -->
  <div class="header">
    <a class="back-btn" href="index.html">← 홈으로</a>
    <div class="logo">MENTOR<span>ONE</span></div>
  </div>

  <!-- 페이지 타이틀 -->
  <div class="page-hero">
    <div class="page-label">Past Exam · 기출문제</div>
    <div class="page-title">'26년 실기 구술<br>기출문제 모음</div>
    <div class="page-sub">실제 시험에 출제된 질문으로 최종 점검하세요</div>
  </div>

  <!-- 날짜 목록 -->
  <div class="section-label">시험 날짜 선택</div>
  <div class="date-list">

    <a class="date-card" href="kichul_2026_0613.html">
      <div class="date-icon">📝</div>
      <div class="date-info">
        <div class="date-badge-row">
          <span class="new-badge"><span class="new-dot"></span>NEW</span>
        </div>
        <div class="date-title">6월 13일 기출문제</div>
        <div class="date-meta">73문제 · 보디빌딩 실기 구술</div>
      </div>
      <div class="date-arrow">→</div>
    </a>

    <a class="date-card" href="kichul_2026_0614.html">
      <div class="date-icon">📚</div>
      <div class="date-info">
        <div class="date-badge-row">
          <span class="new-badge"><span class="new-dot"></span>NEW</span>
        </div>
        <div class="date-title">6월 13·14일 종합문제</div>
        <div class="date-meta">104문제 · 보디빌딩 실기 구술</div>
      </div>
      <div class="date-arrow">→</div>
    </a>

  </div>

  <!-- 푸터 -->
  <div class="footer">
    <div class="footer-logo">MENTOR<span>ONE</span></div>
    <div class="footer-text">스포츠지도사 2급 합격을 응원합니다 💪</div>
  </div>

</div>
</body>
</html>
